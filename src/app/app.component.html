<!--
  Mobile: header compact masqué sur /login, contenu pleine largeur.
  Desktop: header permanent + contenu centré, max 1100 px.
-->
@if (!surLogin()) {
  <app-header />
  @if (estAdmin()) {
    <app-admin-main />
  }
}

<main class="contenu">
  <router-outlet />
</main>

@if (splashVisible()) {
  <div class="splash">
    <div class="logo">
      <img src="logo-ensad.png" style="display:inline;position:relative;max-width:150px;max-height:200px;height: 20vh;">
    </div>

    <div class="main_title">
      <h1>{{settings.appname}}</h1>
      <small>version {{settings.version}}</small>
    </div>
    <img src="soutenance.jpg" alt="" />
  </div>
}
