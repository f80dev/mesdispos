<!--
  Mobile: header compact masqué sur /login, contenu pleine largeur.
  Desktop: header permanent + contenu centré, max 1100 px.
-->
@if (!surLogin()) {
  <app-header />
  @if (estAdmin()) {
    <app-admin-main />
  }
}

<main class="contenu">
  <router-outlet />
</main>

@if (splashVisible()) {
  <div class="splash">
    <div class="main_title">
      <h1 [style.color]="settings.color">{{settings.appname}}</h1>
      <small>version {{settings.version}}</small>
    </div>
    @if (settings.splash_screen) {
      <img [src]="settings.splash_screen" alt="" />
    }

  </div>
}
