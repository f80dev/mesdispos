<!--
  Mobile: logo « MesDispos » + avatar sans nom + bouton déconnexion 48 px.
  Desktop: idem + nom affiché à côté de l'avatar + lien admin si concerné.
-->
<header class="header">
  <a class="marque" [routerLink]="ROUTES.dispos">
    <mat-icon aria-hidden="true">event_available</mat-icon>
    <span class="titre">MesDispos</span>
  </a>

  @if (estAdminCourant()) {
    <button
      matButton
      type="button"
      class="lien-admin"
      [matMenuTriggerFor]="menuAdmin"
      aria-label="Menu administrateur"
    >
      <mat-icon aria-hidden="true">admin_panel_settings</mat-icon>
      <span class="libelle-admin">Admin</span>
    </button>

    <mat-menu #menuAdmin="matMenu">
      <a mat-menu-item [routerLink]="ROUTES.admin">
        <mat-icon aria-hidden="true">upload_file</mat-icon>
        Importer des créneaux
      </a>
      <a mat-menu-item [routerLink]="ROUTES.adminPrompt">
        <mat-icon aria-hidden="true">content_copy</mat-icon>
        Prompt IA
      </a>
    </mat-menu>
  }

  @if (user(); as utilisateur) {
    <div class="session">
      <span class="avatar" [attr.aria-hidden]="true">{{ initiale() }}</span>
      <span class="nom">{{ utilisateur.displayName }}</span>
      <button
        matIconButton
        type="button"
        class="deconnexion"
        aria-label="Se déconnecter"
        title="Se déconnecter"
        (click)="seDeconnecter()"
      >
        <mat-icon>logout</mat-icon>
      </button>
    </div>
  }
</header>
