  @if (user(); as utilisateur) {
    <div class="session">

      <div style="display: inline-flex;align-items: center;">
        <span class="avatar" [attr.aria-hidden]="true">{{ initiale() }}</span>
        &nbsp;&nbsp;
        <span class="nom">{{ utilisateur.displayName }}</span>
      </div>



        @if (joursRestants() < 30) {
          <div
            class="echeance" [class.urgente]="true">
      <mat-icon aria-hidden="true" style="margin-bottom: -7px;">schedule</mat-icon>&nbsp;
      <span class="echeance-libelle">{{ (joursRestants() ?? 0) > 0 ? 'Il reste ' + joursRestants() + ' jour(s) pour répondre' : 'Date limite de réponse dépassée' }}</span>
    </div>
        }


      <div>
        <app-theme-switcher />

        <button
          matIconButton
          type="button"
          class="deconnexion"
          aria-label="Se déconnecter"
          title="Se déconnecter"
          (click)="seDeconnecter()">
          <mat-icon>logout</mat-icon>
        </button>
      </div>


    </div>
  }
